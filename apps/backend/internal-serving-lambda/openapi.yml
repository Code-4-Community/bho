openapi: 3.0.3
info:
  title: Internal Serving API
  version: 0.0.0
  description: Internal API routes served by internal-serving-lambda.

paths:
  /health:
    get:
      summary: Health check
      description: Returns `ok` if the lambda is up and able to handle requests.
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'

  /imports:
    get:
      summary: List imports
      description: >-
        Returns one page of uploads, newest `uploadedAt` first. Filters combine
        with AND. Each import omits `errors`; use `GET /imports/{id}` for them.
      operationId: listImports
      tags:
        - Imports
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - daily
              - historical
        - name: status
          in: query
          schema:
            type: string
            enum:
              - succeeded
              - failed
        - name: uploadedFrom
          in: query
          description: >-
            Only imports uploaded at or after this time. ISO 8601 in UTC, e.g.
            `2026-10-01T00:00:00Z`.
          schema:
            type: string
            format: date-time
        - name: uploadedTo
          in: query
          description: >-
            Only imports uploaded at or before this time. ISO 8601 in UTC. Must
            not be before `uploadedFrom`.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Number of imports to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of imports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportList'
              example:
                imports:
                  - id: 2
                    kind: daily
                    fileName: July 2026.csv
                    s3Key: daily/2026-10-26/3f2b6c1e-8a4d-4b7e-9c2f-1d5e6a7b8c9d.csv
                    fileHash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    uploadedBy: 1
                    uploadedAt: '2026-10-26T12:00:00.000Z'
                    status: failed
                total: 1
                limit: 25
                offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /imports/upload-url/{kind}:
    post:
      summary: Request an upload URL
      description: >-
        Returns a presigned S3 URL for uploading a spreadsheet. The client PUTs
        the file to `uploadUrl` with `Content-Type: text/csv` before
        `expiresAt`. The uploader and original file name are stored as object
        metadata for the upload handler. See `docs/upload-keys.md`.
      operationId: createUploadUrl
      tags:
        - Imports
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - daily
              - historical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadUrlRequest'
            example:
              fileName: July 2026.csv
      responses:
        '200':
          description: The upload URL was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadUrlResponse'
              example:
                uploadUrl: https://bho-uploads.s3.us-east-1.amazonaws.com/daily/2026-10-26/3f2b6c1e-8a4d-4b7e-9c2f-1d5e6a7b8c9d.csv?X-Amz-Algorithm=AWS4-HMAC-SHA256&...
                s3Key: daily/2026-10-26/3f2b6c1e-8a4d-4b7e-9c2f-1d5e6a7b8c9d.csv
                expiresAt: '2026-10-26T12:05:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token.

  schemas:
    CreateUploadUrlRequest:
      type: object
      required:
        - fileName
      properties:
        fileName:
          type: string
          description: Original file name. Must end in `.csv`.
    CreateUploadUrlResponse:
      type: object
      required:
        - uploadUrl
        - s3Key
        - expiresAt
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL.
        s3Key:
          type: string
          description: Key the file will be stored under, `<kind>/<date>/<uuid>.csv`.
        expiresAt:
          type: string
          format: date-time
          description: When `uploadUrl` stops working, 5 minutes after creation.
    ImportSummary:
      type: object
      description: One upload, without its `errors`.
      required:
        - id
        - kind
        - fileName
        - s3Key
        - fileHash
        - uploadedBy
        - uploadedAt
        - status
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
            - daily
            - historical
        fileName:
          type: string
          description: Original file name.
        s3Key:
          type: string
        fileHash:
          type: string
          description: SHA-256 of the file.
        uploadedBy:
          type: integer
          description: Id of the user who uploaded the file.
        uploadedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - succeeded
            - failed
    ImportList:
      type: object
      required:
        - imports
        - total
        - limit
        - offset
      properties:
        imports:
          type: array
          items:
            $ref: '#/components/schemas/ImportSummary'
        total:
          type: integer
          description: Number of imports matching the filters, across all pages.
        limit:
          type: integer
        offset:
          type: integer
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: The request has an invalid path parameter or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'kind must be one of: daily, historical'
    Unauthorized:
      description: The request has no valid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    Forbidden:
      description: The user is signed in but isn't staff or an admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Forbidden
    InternalServerError:
      description: Unexpected error while handling the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Internal server error
